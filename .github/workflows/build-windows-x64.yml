name: Build Windows x64

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Crucial if plog or others are submodules

    - name: Install Dependencies via vcpkg
      run: vcpkg install zlib:x64-windows plog:x64-windows

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build -A x64 
        -DCMAKE_BUILD_TYPE=Release 
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        -DCMAKE_CXX_FLAGS="/I${{github.workspace}}" 
        -DCMAKE_C_FLAGS="/I${{github.workspace}}"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: morph_dict-windows-x64
        path: ${{github.workspace}}/build/Release/
        retention-days: 7
