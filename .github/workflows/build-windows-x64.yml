name: Build Windows x64

on:
  workflow_dispatch: 

jobs:
  build:
    # Uses the latest Windows Server environment (includes MSVC, CMake, etc.)
    runs-on: windows-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # Helpful if morph_dict relies on submodules

    # 2. Configure CMake for Windows x64
    - name: Configure CMake
      # -B build: Creates a 'build' directory
      # -A x64: Specifically targets the x64 architecture using the MSVC generator
      run: cmake -B ${{github.workspace}}/build -A x64 -DCMAKE_BUILD_TYPE=Release

    # 3. Build the project
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    # 4. Upload the compiled binaries as an artifact so you can download them
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: morph_dict-windows-x64
        # Adjust this path based on where your final executable/DLL is generated
        path: ${{github.workspace}}/build/Release/
        retention-days: 7
